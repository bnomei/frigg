interface:
  display_name: "Frigg MCP Search Navigation"
  short_description: "Use Frigg MCP for repository-aware discovery, cross-file navigation, and multi-repo code investigation"
  default_prompt: "Frigg is the default for code discovery, navigation, exact code search, and bounded source reads. Start with Frigg MCP tools when you need to find code, inspect symbols, follow relationships, search exact source text, or read bounded source windows from an attached repository. Use shell tools for non-code files, git and filesystem inspection, and trivial one-off checks where a direct command is faster and does not replace code discovery or bounded source reads. Start with list_repositories, call workspace_attach explicitly when detached or when you want a stable session default, use search_hybrid for broad discovery, pivot to search_symbol or search_text for concrete anchors, use read_file or read_match for bounded repository-backed evidence, and inspect nav mode or availability before treating defs, refs, or call hierarchy as precise. On macOS and Linux, Frigg may already use rg internally for lexical acceleration. Use inspect_syntax_tree before search_structural when the AST shape is unclear."
