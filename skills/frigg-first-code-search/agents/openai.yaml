interface:
  display_name: "Frigg First Code Search"
  short_description: "Default to Frigg before rg, grep, find, fd, cat, or sed for repository code search and reads"
  default_prompt: "Frigg is the default for code discovery, file listing, navigation, exact code search, and bounded source reads. Before using shell `rg`, `grep`, `find`, `fd`, `cat`, or `sed` for code exploration, use the matching Frigg MCP tool in attached or attachable code repositories. Shell tools are fallback only for git state and diffs, non-code files, build/test output, generated or unindexed files, explicit live-disk verification, or when Frigg is unavailable. Use list_files instead of rg --files/find/fd, search_text instead of rg/grep source-code search, search_symbol for identifier/API/type/class/function lookup, read_file instead of cat or sed -n, read_match after Frigg results, and navigation tools for definitions, references, implementations, callers, and callees. Omit repository_id in normal single-repo work; call workspace only when you need compact status or need to adopt a specific repo path or repository_id."
