name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Check
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Run clippy
        run: cargo clippy -p frigg --all-targets -- -D warnings

  test:
    name: Test Suite
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Run tests
        run: cargo test -p frigg --all-targets

  futura-bench:
    name: frigg-futura-bench (FUT-019)
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      # Release profile binds FUT-023 (strict frigg_p95 <= rg_p95). Debug still runs
      # contract scenarios locally; soft budget only in debug_assertions.
      - name: Run frigg-futura-bench (release)
        env:
          FUTURA_BENCH_OUT: ${{ runner.temp }}/futura-bench-summary.json
          FUTURA_SLO_OUT: ${{ runner.temp }}/futura-slo-snapshot.md
        run: cargo test -p frigg --test futura_bench --release -- --nocapture
      - name: Upload futura-bench summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futura-bench-summary
          path: |
            ${{ runner.temp }}/futura-bench-summary.json
            ${{ runner.temp }}/futura-slo-snapshot.md
          if-no-files-found: ignore

  scorecard:
    name: Frigg Maintainability Scorecard
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Run locked all-target tests
        run: cargo test --locked -p frigg --all-targets
      - name: Run documentation tests
        run: cargo test --locked -p frigg --doc
      - name: Compile benchmarks
        run: cargo bench --locked -p frigg --no-run
